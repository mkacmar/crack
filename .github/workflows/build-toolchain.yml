name: "Build Toolchain Images"

# actions/checkout v7.0.1: 3d3c42e5aac5ba805825da76410c181273ba90b1
# docker/login-action v4.6.0: dbcb813823bdd20940b903addbd779551569679f
# docker/setup-buildx-action v4.3.0: 37fe631027851001ddb9b187196cc803df7f5f0e
# docker/setup-qemu-action v4.2.0: 96fe6ef7f33517b61c61be40b68a1882f3264fb8

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated images to build, or 'all'"
        required: true
        default: "all"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}/toolchain-

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gcc13-clang18-amd64
            tag: v1
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: gcc13-clang18-arm64
            tag: v1
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: gcc13-clang18-musl-armv7
            tag: v1
            platform: linux/arm/v7
            runner: ubuntu-24.04
            qemu: true
            qemu_platform: arm
          - image: gcc13-clang18-musl-arm64
            tag: v1
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: gcc14-clang19-musl-riscv64
            tag: v1
            platform: linux/riscv64
            runner: ubuntu-24.04
            qemu: true
            qemu_platform: riscv64
          - image: gcc4
            tag: v1
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: gcc7-arm64
            tag: v1
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: android-ndk-r27c
            tag: v1
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: glibc-pac-arm64
            tag: v1
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        if: matrix.qemu
        with:
          platforms: ${{ matrix.qemu_platform }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: inputs.images == 'all' || contains(format(',{0},', inputs.images), format(',{0},', matrix.image))
        run: |
          if docker manifest inspect ${{ env.IMAGE_PREFIX }}${{ matrix.image }}:${{ matrix.tag }} > /dev/null 2>&1; then
            echo "::error::Tag ${{ matrix.image }}:${{ matrix.tag }} already exists. Bump the version."
            exit 1
          fi
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --push \
            -t ${{ env.IMAGE_PREFIX }}${{ matrix.image }}:${{ matrix.tag }} \
            -f test/e2e/docker/Dockerfile.${{ matrix.image }} \
            test/e2e/docker/
