name: "Golden: ARM BTI"

# actions/checkout v7.0.1: 3d3c42e5aac5ba805825da76410c181273ba90b1
# actions/download-artifact v8.0.1: 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
# actions/upload-artifact v7.0.1: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  TOOLCHAIN: ghcr.io/${{ github.repository }}/toolchain-

jobs:
  build-glibc:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build binaries
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            ${{ env.TOOLCHAIN }}gcc13-clang18-arm64:v1 \
            sh test/e2e/elf/arm-bti/build.sh glibc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glibc-binaries
          path: binaries/

  build-musl:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build binaries
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            ${{ env.TOOLCHAIN }}gcc13-clang18-musl-arm64:v1 \
            sh test/e2e/elf/arm-bti/build.sh musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: musl-binaries
          path: binaries/

  merge:
    runs-on: ubuntu-latest
    needs: [build-glibc, build-musl]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: all-binaries
          pattern: "*-binaries"
          merge-multiple: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arm-bti-binaries
          path: all-binaries/
